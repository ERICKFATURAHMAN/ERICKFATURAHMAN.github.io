<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Jemput — NOMO (No More Waste)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F6F8F7] text-[#111827] pb-20 lg:pb-10 overflow-x-hidden">

    <div class="flex flex-col lg:flex-row min-h-screen">
        <!-- Sidebar & Mobile Header Mount -->
        <div id="nomo-sidebar-mount"></div>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 w-full max-w-6xl mx-auto px-3.5 sm:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6">

            <!-- Header -->
            <header class="flex flex-wrap items-center justify-between gap-2.5">
                <div>
                    <p class="text-xs font-semibold text-gray-500">Logistik Pakan Organik</p>
                    <h1 class="text-base sm:text-2xl font-extrabold text-[#111827] tracking-tight">Jadwal Penjemputan Restoran</h1>
                </div>
                <span id="armada-badge" class="px-3 py-1.5 rounded-lg bg-white border border-gray-200/80 text-xs font-extrabold text-[#111827]">
                    Armada #02 Siaga
                </span>
            </header>

            <!-- Toast Notifikasi -->
            <div id="maggot-pickup-toast" class="hidden bg-[#0B533E] text-white p-3.5 sm:px-5 rounded-2xl flex items-center gap-2.5">
                <i data-lucide="check-circle-2" class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-300 shrink-0"></i>
                <p id="maggot-pickup-toast-msg" class="text-xs sm:text-sm font-bold"></p>
            </div>

            <!-- 2 KPI Ringkas Pengangkutan -->
            <div class="grid grid-cols-2 gap-3.5 sm:gap-5">
                <div class="bg-[#111827] text-white rounded-2xl p-4 sm:p-5">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block">Antrean Perlu Dijemput</span>
                    <div class="flex items-baseline gap-1.5 mt-1">
                        <span id="stat-pending-kg" class="text-2xl sm:text-3xl font-black">0.0</span>
                        <span class="text-xs font-bold text-emerald-400">Kg</span>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1"><span id="stat-pending-count">0</span> titik restoran menunggu</p>
                </div>

                <div class="bg-white rounded-2xl border border-gray-200/80 p-4 sm:p-5">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 block">Total Terangkut Selesai</span>
                    <div class="flex items-baseline gap-1.5 mt-1">
                        <span id="stat-done-kg" class="text-2xl sm:text-3xl font-black text-[#0B533E]">0.0</span>
                        <span class="text-xs font-bold text-gray-500">Kg</span>
                    </div>
                    <p class="text-[11px] text-gray-500 mt-1">Masuk ke biopond maggot</p>
                </div>
            </div>

            <!-- Daftar Permintaan Penjemputan -->
            <div class="bg-white rounded-2xl border border-gray-200/80 p-5 sm:p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3.5 border-b border-gray-100">
                    <div>
                        <h2 class="text-sm sm:text-base font-extrabold text-[#111827]">Daftar Permintaan Masuk</h2>
                        <p class="text-xs text-gray-500">Konfirmasi penjemputan setelah limbah ditimbang di lokasi resto</p>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="grid grid-cols-3 sm:flex items-center gap-1 bg-[#F6F8F7] p-1 rounded-xl w-full sm:w-fit">
                        <button onclick="setPickupFilter('all')" id="pflt-all" class="pflt-btn px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold bg-[#0B533E] text-white transition text-center">Semua</button>
                        <button onclick="setPickupFilter('pending')" id="pflt-pending" class="pflt-btn px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold text-gray-500 hover:text-[#111827] transition text-center">Dijadwalkan</button>
                        <button onclick="setPickupFilter('done')" id="pflt-done" class="pflt-btn px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold text-gray-500 hover:text-[#111827] transition text-center">Selesai</button>
                    </div>
                </div>

                <div id="maggot-pickups-list" class="divide-y divide-gray-100"></div>
            </div>

        </main>
    </div>

    <script src="nomo-app.js"></script>
    <script>
        renderMaggotShell('maggot-pickups');
        let currentFilter = 'all';

        function setPickupFilter(flt) {
            currentFilter = flt;
            document.querySelectorAll('.pflt-btn').forEach(b => {
                b.classList.remove('bg-[#0B533E]', 'text-white');
                b.classList.add('text-gray-500');
            });
            const active = document.getElementById('pflt-' + flt);
            active.classList.remove('text-gray-500');
            active.classList.add('bg-[#0B533E]', 'text-white');
            renderMaggotPickups();
        }

        function renderMaggotPickups() {
            const m = getMaggotMetrics();
            document.getElementById('armada-badge').textContent = m.facility.activeArmada;
            document.getElementById('stat-pending-kg').textContent = m.incomingPendingKg.toFixed(1);
            document.getElementById('stat-pending-count').textContent = m.pendingPickups.length;
            document.getElementById('stat-done-kg').textContent = m.completedFeedKg.toFixed(1);

            const filtered = m.myPickups.filter(req => {
                if (currentFilter === 'pending') return req.status !== 'Selesai';
                if (currentFilter === 'done') return req.status === 'Selesai';
                return true;
            });

            const container = document.getElementById('maggot-pickups-list');
            if (filtered.length === 0) {
                container.innerHTML = `<p class="py-6 text-center text-xs text-gray-500">Tidak ada jadwal penjemputan pada kategori ini.</p>`;
                return;
            }

            container.innerHTML = filtered.map(req => {
                const isDone = req.status === 'Selesai';
                const restoName = req.resto_name || m.data.resto.name;
                const restoLoc = req.resto_loc || m.data.resto.location;

                return `
                <div class="py-3.5 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-start gap-3 min-w-0">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl ${isDone ? 'bg-[#ECFDF5] text-[#0B533E]' : 'bg-[#111827] text-white'} flex items-center justify-center shrink-0">
                            <i data-lucide="${isDone ? 'check-circle-2' : 'store'}" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-1.5">
                                <p class="text-xs sm:text-sm font-extrabold text-[#111827] truncate">${restoName}</p>
                                <span class="px-2 py-0.5 rounded-md text-[9px] font-extrabold ${isDone ? 'bg-[#ECFDF5] text-[#0B533E]' : 'bg-[#111827] text-white'}">
                                    ${req.status}
                                </span>
                            </div>
                            <p class="text-[11px] text-gray-600 mt-0.5">${req.waste_type} | <strong>${Number(req.weight).toFixed(1)} Kg</strong></p>
                            <p class="text-[10px] text-gray-400 mt-0.5 flex items-center gap-1 truncate">
                                <i data-lucide="map-pin" class="w-3 h-3 text-[#0B533E] shrink-0"></i> ${restoLoc} | ${req.pickup_date}
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-2 shrink-0 pl-12 sm:pl-0">
                        ${isDone
                            ? `<span class="text-[11px] font-bold text-gray-400">${req.driver}</span>`
                            : `<button type="button" onclick="completePickup('${req.id}')" class="w-full sm:w-auto bg-[#0B533E] hover:bg-[#083F2F] text-white font-extrabold px-4 py-2 rounded-full text-xs transition flex items-center justify-center gap-1.5">
                                <i data-lucide="check" class="w-3.5 h-3.5"></i> Selesai Jemput
                               </button>`
                        }
                    </div>
                </div>`;
            }).join('');

            lucide.createIcons();
        }

        function completePickup(reqId) {
            const state = getNomoData();
            const target = state.pickups.find(p => p.id === reqId);
            if (!target) return;

            target.status = 'Selesai';
            target.driver = `${state.maggotFacility.owner} | ${state.maggotFacility.activeArmada}`;
            saveNomoData(state);
            renderMaggotPickups();

            const toast = document.getElementById('maggot-pickup-toast');
            document.getElementById('maggot-pickup-toast-msg').textContent = `Penjemputan ${target.weight} Kg dari ${target.resto_name || state.resto.name} selesai! Status di sisi restoran otomatis terbarui.`;
            toast.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderMaggotPickups();
    </script>
</body>
</html>
